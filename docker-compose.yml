# ============================================
# OpsPilot AI — Docker Compose (Development)
# ============================================
# Usage: docker-compose up -d

services:
  # ── PostgreSQL Database ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_secret
      POSTGRES_DB: opspilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  # ── Redis (Cache + Message Broker) ──────
  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  # ── FastAPI Backend ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - DATABASE_URL_SYNC=postgresql://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-prod
      - SECRET_KEY=dev-secret-key-change-in-prod
      - APP_ENV=development
      - DEBUG=true
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opspilot-network

  # ── React Frontend ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - opspilot-network

volumes:
  postgres_data:
  redis_data:

networks:
  opspilot-network:
    driver: bridge
