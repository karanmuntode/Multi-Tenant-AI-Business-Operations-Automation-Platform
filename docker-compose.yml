# ============================================
# OpsPilot AI — Docker Compose (Development)
# ============================================
# Usage: docker-compose up -d

services:
  # ── PostgreSQL Database ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_secret
      POSTGRES_DB: opspilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  # ── Redis (Cache + Message Broker) ──────
  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  # ── FastAPI Backend ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - DATABASE_URL_SYNC=postgresql://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-prod
      - SECRET_KEY=dev-secret-key-change-in-prod
      - APP_ENV=development
      - DEBUG=true
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opspilot-network

  # ── React Frontend ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - opspilot-network

  # ── Celery Background Worker ───────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-celery-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - DATABASE_URL_SYNC=postgresql://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - APP_ENV=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opspilot-network

  # ── Celery Beat Scheduler ──────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-celery-beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_secret@postgres:5432/opspilot_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - APP_ENV=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opspilot-network

  # ── Prometheus (Metrics Collection) ────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: opspilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - opspilot-network

  # ── Grafana (Observability Dashboards) ─
  grafana:
    image: grafana/grafana:10.4.1
    container_name: opspilot-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=opspilot_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - opspilot-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  opspilot-network:
    driver: bridge
